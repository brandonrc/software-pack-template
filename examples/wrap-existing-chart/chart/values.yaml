# Default values for my-pack (wrapping Podinfo)
# This is a YAML-formatted file.

# =============================================================================
# Nebari Integration
# =============================================================================
# NebariApp CR (https://github.com/nebari-dev/nebari-operator).
# Rendered through the official nebari-app.nebariApp template
# (https://github.com/nebari-dev/nebari-operator/tree/main/charts/nebari-app) with templating enabled.
nebariapp:
  enabled: false
  hostname: '{{ fail "nebariapp.hostname is required when nebariapp.enabled is true" }}'
  service:
    # Points to the upstream podinfo chart's service
    name: '{{ include "my-pack.podinfo-service-name" . | toJson }}'
    port: 9898
  auth:
    enabled: false
    provider: keycloak
    provisionClient: true
    # redirectURI: /oauth2/callback   # Default (operator-supplied); set only to override
    scopes:
      - openid
      - profile
      - email
  gateway: public

# =============================================================================
# Podinfo Overrides
# =============================================================================
# All values under this key are passed to the podinfo subchart.
# See https://github.com/stefanprodan/podinfo/tree/master/charts/podinfo
podinfo:
  replicaCount: 1
  ui:
    message: "Hello from Nebari!"

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
