{{/*
  Optional: only let the Envoy Gateway proxies reach the app's pods, so requests
  cannot bypass the OIDC filter by calling the Service from inside the cluster.
  This does not cover routing.publicRoutes, which go through the gateway without
  a SecurityPolicy; the app's own token verification handles those.

  The proxy labels and gatewayNamespace below describe how the platform deploys
  Envoy Gateway, not anything this pack controls. If you copy this file, expect to
  update them when the platform changes; nebari-operator#197 tracks giving the
  selector one owner in the nebari-app chart.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "my-pack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-pack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "my-pack.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
