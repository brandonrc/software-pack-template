apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-pack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-pack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "my-pack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "my-pack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if and .Values.nebariapp.enabled .Values.nebariapp.auth.enabled }}
          # The app verifies the IdToken itself; Envoy Gateway does not check its
          # signature. Client ID and issuer come from the operator's OIDC Secret.
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "my-pack.fullname" . }}-oidc-client
                  key: client-id
            - name: OIDC_ISSUER_URL
              {{- if .Values.oidc.issuerURL }}
              value: {{ .Values.oidc.issuerURL | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "my-pack.fullname" . }}-oidc-client
                  key: issuer-url
              {{- end }}
            {{- with .Values.oidc.jwksURL }}
            - name: OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
