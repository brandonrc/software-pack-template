# Default values for my-pack (auth-aware FastAPI)
# This is a YAML-formatted file.

# =============================================================================
# Application
# =============================================================================
image:
  repository: ghcr.io/nebari-dev/software-pack-template/auth-fastapi-example
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# =============================================================================
# Nebari Integration
# =============================================================================
# NebariApp CR (https://github.com/nebari-dev/nebari-operator).
# Rendered through the official nebari-app.nebariApp template
# (https://github.com/nebari-dev/nebari-operator/tree/main/charts/nebari-app) with templating enabled.
nebariapp:
  enabled: false
  hostname: '{{ fail "nebariapp.hostname is required when nebariapp.enabled is true" }}'
  service:
    name: '{{ include "my-pack.fullname" . | toJson }}'
    port: '{{ .Values.service.port }}'
  routing:
    routes:
      - pathPrefix: /
        pathType: PathPrefix
    publicRoutes:
      - pathPrefix: /health
        pathType: Exact
    tls:
      enabled: true
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    # redirectURI: /oauth2/callback   # Default (operator-supplied); set only to override
    scopes:
      - openid
      - profile
      - email
  gateway: public

# =============================================================================
# Token verification
# =============================================================================
# The app verifies the IdToken signature itself, because Envoy Gateway does not.
# With nebariapp.auth.enabled, the client ID and issuer are read from the
# operator-created <fullname>-oidc-client Secret. Override them when that
# Secret's issuer-url is empty (operator running without KEYCLOAK_EXTERNAL_URL)
# or when pods cannot reach the public Keycloak URL.
oidc:
  issuerURL: ""   # expected `iss` claim; defaults to the Secret's issuer-url
  jwksURL: ""     # defaults to <issuer>/protocol/openid-connect/certs

# Only allow the Envoy Gateway proxies to reach the app's pods. Requires a CNI
# that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  gatewayNamespace: envoy-gateway-system

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
