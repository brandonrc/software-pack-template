# Exposes the dev Keycloak at https://keycloak.nebari.local/auth so the browser
# half of the OIDC login can reach it, the same way NIC exposes keycloak.<domain>.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: nebari-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - keycloak.nebari.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      filters:
        # The dev Keycloak trusts only the RFC 7239 Forwarded header
        # (KC_PROXY_HEADERS=forwarded). Without it, Keycloak builds http://
        # login URLs and the browser leaves HTTPS mid-login.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Forwarded
                value: proto=https;host=keycloak.nebari.local
      backendRefs:
        - name: keycloak-keycloakx-http
          port: 80
