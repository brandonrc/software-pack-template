name: Integration Test (NebariApp)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "dev/**"
      - ".github/workflows/test-integration.yaml"

jobs:
  nebariapp-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # v0.1.1 is the release the template documents; v0.1.0-alpha.20 is what
        # NIC v0.14.0 deploys, so packs are also proven on today's clusters.
        operator-ref: [v0.1.1, v0.1.0-alpha.20]
    name: nebariapp-integration (${{ matrix.operator-ref }})
    env:
      CLUSTER_NAME: pack-integration
      OPERATOR_REF: ${{ matrix.operator-ref }}
    steps:
      - name: Checkout software-pack-template
        uses: actions/checkout@v5

      - name: Checkout nebari-operator (for dev/scripts)
        uses: actions/checkout@v5
        with:
          repository: nebari-dev/nebari-operator
          ref: ${{ env.OPERATOR_REF }}
          path: nebari-operator

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pack-integration

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # ============================================================
      # Infrastructure: MetalLB
      # ============================================================
      - name: Install MetalLB
        run: |
          kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.8/config/manifests/metallb-native.yaml
          kubectl wait --namespace metallb-system \
            --for=condition=available deployment/controller \
            --timeout=90s
          kubectl wait --namespace metallb-system \
            --for=jsonpath='{.status.numberReady}'=1 \
            daemonset/speaker \
            --timeout=90s

      - name: Configure MetalLB IP pool
        run: |
          KIND_NET_CIDR=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}}{{"\n"}}{{end}}' | grep '\.' | head -n1)
          BASE_IP=$(echo "${KIND_NET_CIDR}" | awk -F. '{print $1"."$2}')
          kubectl apply -f - <<EOF
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: kind-pool
            namespace: metallb-system
          spec:
            addresses:
              - ${BASE_IP}.255.200-${BASE_IP}.255.250
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: kind-l2
            namespace: metallb-system
          spec:
            ipAddressPools:
              - kind-pool
          EOF

      # ============================================================
      # Infrastructure: Envoy Gateway, cert-manager, Keycloak
      # ============================================================
      - name: Install foundational services
        run: nebari-operator/dev/scripts/services/install.sh

      - name: Setup Keycloak realm
        run: nebari-operator/dev/scripts/services/keycloak/setup.sh

      # ============================================================
      # Install nebari-operator, configured the way NIC configures it
      # ============================================================
      - name: Install nebari-operator
        run: |
          kubectl apply -f https://github.com/nebari-dev/nebari-operator/releases/download/${OPERATOR_REF}/install.yaml

      - name: Wait for nebari-operator
        run: |
          kubectl wait --for=condition=available deployment/nebari-operator-controller-manager \
            -n nebari-operator-system --timeout=120s

      - name: Configure nebari-operator and expose Keycloak
        run: dev/configure-operator.sh

      - name: Label default namespace for operator
        run: kubectl label namespace default nebari.dev/managed=true --overwrite

      # ============================================================
      # Build auth-fastapi image (needed for that example)
      # ============================================================
      - name: Build and load auth-fastapi image
        run: |
          docker build -t ghcr.io/nebari-dev/software-pack-template/auth-fastapi-example:latest \
            examples/auth-fastapi/
          kind load docker-image \
            ghcr.io/nebari-dev/software-pack-template/auth-fastapi-example:latest \
            --name pack-integration

      # Each "Verify" step waits for RoutingReady, TLSReady (and AuthReady with
      # --auth), checks the generated HTTPRoute/SecurityPolicy exist, and sends a
      # request through the Gateway. Ready=True alone is not enough: a NebariApp
      # without spec.routing is Ready and unreachable.

      # ============================================================
      # Test: vanilla-yaml
      # ============================================================
      - name: "Deploy vanilla-yaml"
        run: |
          kubectl apply -f examples/vanilla-yaml/deployment.yaml \
                        -f examples/vanilla-yaml/service.yaml
          sed 's/my-pack.nebari.example.com/vanilla.nebari.local/' \
            examples/vanilla-yaml/nebariapp.yaml | kubectl apply -f -

      - name: "Verify vanilla-yaml"
        run: |
          kubectl wait --for=condition=ready pod -l app=my-pack --timeout=120s
          dev/verify-nebariapp.sh my-pack vanilla.nebari.local

      - name: "Cleanup vanilla-yaml"
        if: always()
        run: |
          kubectl delete nebariapp my-pack --ignore-not-found --wait --timeout=60s
          kubectl delete -f examples/vanilla-yaml/deployment.yaml \
                         -f examples/vanilla-yaml/service.yaml --ignore-not-found --wait \
                         --cascade=foreground --timeout=60s

      # ============================================================
      # Test: kustomize-nginx (production overlay - auth enabled)
      # ============================================================
      - name: "Deploy kustomize-nginx (production)"
        run: kubectl apply -k examples/kustomize-nginx/overlays/production/

      - name: "Verify kustomize-nginx"
        run: |
          kubectl wait --for=condition=ready pod -l app=my-pack --timeout=120s
          dev/verify-nebariapp.sh my-pack my-pack.nebari.example.com --auth

      - name: "Cleanup kustomize-nginx"
        if: always()
        run: kubectl delete -k examples/kustomize-nginx/overlays/production/ --ignore-not-found --wait --cascade=foreground --timeout=60s

      # ============================================================
      # Test: basic-nginx (Helm, no auth)
      # ============================================================
      - name: "Deploy basic-nginx"
        run: |
          helm dependency build examples/basic-nginx/chart/
          helm install test-basic examples/basic-nginx/chart/ \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=basic.nebari.local \
            --wait --timeout 2m

      - name: "Verify basic-nginx"
        run: dev/verify-nebariapp.sh test-basic-my-pack basic.nebari.local

      - name: "Cleanup basic-nginx"
        if: always()
        run: helm uninstall test-basic --wait || true

      # ============================================================
      # Test: auth-fastapi (Helm, auth enabled, full login)
      # ============================================================
      - name: "Deploy auth-fastapi"
        run: |
          helm dependency build examples/auth-fastapi/chart/
          helm install test-fastapi examples/auth-fastapi/chart/ \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=fastapi.nebari.local \
            --set nebariapp.auth.enabled=true \
            --set oidc.jwksURL=http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/nebari/protocol/openid-connect/certs \
            --set networkPolicy.enabled=true \
            --wait --timeout 3m

      - name: "Verify auth-fastapi"
        run: |
          dev/verify-nebariapp.sh test-fastapi-my-pack fastapi.nebari.local --auth
          # Log in through Keycloak and check the app shows a verified identity
          dev/login-test.sh fastapi.nebari.local

      - name: "Verify auth-fastapi rejects forged tokens off the gateway"
        run: |
          # An unsigned token sent straight to the Service must not be trusted.
          # With the NetworkPolicy on, the request should not connect at all;
          # temporarily remove it to check the app's own verification as well.
          FORGED='eyJhbGciOiJub25lIn0.eyJwcmVmZXJyZWRfdXNlcm5hbWUiOiJtYWxsb3J5In0.'
          probe() {
            kubectl run forged-probe --rm -i --restart=Never --quiet --image=curlimages/curl:8.11.1 -- \
              sh -c "curl -s -m 5 -H 'Cookie: IdToken-a1b2c3d4=$FORGED' http://test-fastapi-my-pack.default.svc.cluster.local/; echo curl_exit=\$?"
          }
          out=$(probe || true)
          echo "$out" | grep -q 'curl_exit=28' || { echo "NetworkPolicy did not block direct access"; echo "$out"; exit 1; }
          kubectl delete networkpolicy test-fastapi-my-pack --wait
          out=$(probe || true)
          echo "$out" | grep -q 'could not be verified' || { echo "forged token was not rejected"; echo "$out"; exit 1; }
          if echo "$out" | grep -q mallory; then echo "forged identity was displayed"; exit 1; fi
          echo "forged token rejected"

      - name: "Cleanup auth-fastapi"
        if: always()
        run: helm uninstall test-fastapi --wait || true

      # ============================================================
      # Test: wrap-existing-chart / podinfo (Helm, no auth)
      # ============================================================
      - name: "Deploy wrap-existing-chart (podinfo)"
        run: |
          helm dependency build examples/wrap-existing-chart/chart/
          helm install test-wrap examples/wrap-existing-chart/chart/ \
            --set nebariapp.enabled=true \
            --set nebariapp.hostname=podinfo.nebari.local \
            --wait --timeout 3m

      - name: "Verify wrap-existing-chart"
        run: |
          # Podinfo's chart labels its pods with app.kubernetes.io/name=<release>-podinfo
          # and does not set app.kubernetes.io/instance, so wait on the Deployment instead.
          kubectl wait --for=condition=available deployment/test-wrap-podinfo --timeout=120s
          dev/verify-nebariapp.sh test-wrap-my-pack podinfo.nebari.local

      - name: "Cleanup wrap-existing-chart"
        if: always()
        run: helm uninstall test-wrap --wait || true

      # ============================================================
      # Debug on failure
      # ============================================================
      - name: Debug info on failure
        if: failure()
        run: |
          echo "=== NebariApps ==="
          kubectl get nebariapp -o wide || true
          echo ""
          echo "=== NebariApp details ==="
          kubectl describe nebariapp || true
          echo ""
          echo "=== HTTPRoutes ==="
          kubectl get httproute -A || true
          echo ""
          echo "=== SecurityPolicies ==="
          kubectl get securitypolicy -A -o yaml | grep -A6 'conditions:' || true
          echo ""
          echo "=== Operator logs ==="
          kubectl logs -n nebari-operator-system deployment/nebari-operator-controller-manager \
            --tail=100 || true
          echo ""
          echo "=== Envoy Gateway logs ==="
          kubectl logs -n envoy-gateway-system deployment/envoy-gateway --tail=50 || true
          echo ""
          echo "=== Pods ==="
          kubectl get pods -A || true
          echo ""
          echo "=== Events ==="
          kubectl get events --sort-by=.lastTimestamp | tail -50 || true
