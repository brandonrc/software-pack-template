name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.8.0
          KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      # Vanilla YAML example
      - name: Validate vanilla-yaml manifests
        run: |
          kubeconform -strict -ignore-missing-schemas \
            examples/vanilla-yaml/deployment.yaml \
            examples/vanilla-yaml/service.yaml \
            examples/vanilla-yaml/nebariapp.yaml

      # Kustomize example
      - name: Validate kustomize base
        run: kubectl kustomize examples/kustomize-nginx/base/ | kubeconform -strict -ignore-missing-schemas

      - name: Validate kustomize dev overlay
        run: kubectl kustomize examples/kustomize-nginx/overlays/dev/ | kubeconform -strict -ignore-missing-schemas

      - name: Validate kustomize production overlay
        run: kubectl kustomize examples/kustomize-nginx/overlays/production/ | kubeconform -strict -ignore-missing-schemas

      # Basic nginx Helm example
      - name: Build basic-nginx dependencies
        run: helm dependency build examples/basic-nginx/chart/

      - name: Lint basic-nginx
        run: helm lint examples/basic-nginx/chart/

      - name: Template basic-nginx (NebariApp disabled)
        run: helm template test examples/basic-nginx/chart/ --set nebariapp.enabled=false

      - name: Template basic-nginx (NebariApp enabled)
        run: helm template test examples/basic-nginx/chart/ --set nebariapp.enabled=true --set nebariapp.hostname=test.example.com

      # Auth-aware FastAPI Helm example
      - name: Build auth-fastapi dependencies
        run: helm dependency build examples/auth-fastapi/chart/

      - name: Lint auth-fastapi
        run: helm lint examples/auth-fastapi/chart/

      - name: Template auth-fastapi (NebariApp disabled)
        run: helm template test examples/auth-fastapi/chart/ --set nebariapp.enabled=false

      - name: Template auth-fastapi (NebariApp enabled)
        run: helm template test examples/auth-fastapi/chart/ --set nebariapp.enabled=true --set nebariapp.hostname=test.example.com

      # Wrap existing chart (Podinfo) Helm example
      - name: Build wrap-existing-chart dependencies
        run: helm dependency build examples/wrap-existing-chart/chart/

      - name: Lint wrap-existing-chart
        run: helm lint examples/wrap-existing-chart/chart/

      - name: Template wrap-existing-chart (NebariApp disabled)
        run: helm template test examples/wrap-existing-chart/chart/ --set nebariapp.enabled=false

      - name: Template wrap-existing-chart (NebariApp enabled)
        run: helm template test examples/wrap-existing-chart/chart/ --set nebariapp.enabled=true --set nebariapp.hostname=test.example.com

      - name: Template auth-fastapi (NetworkPolicy enabled)
        run: helm template test examples/auth-fastapi/chart/ --set nebariapp.enabled=true --set nebariapp.hostname=test.example.com --set networkPolicy.enabled=true | kubeconform -strict -ignore-missing-schemas

      # Without spec.routing the operator creates no HTTPRoute or TLS, yet the
      # NebariApp still reports Ready. Fail fast if an example chart drops it.
      - name: Every chart renders a NebariApp with routing
        run: |
          for c in basic-nginx auth-fastapi wrap-existing-chart; do
            routes=$(helm template test examples/$c/chart/ --set nebariapp.enabled=true --set nebariapp.hostname=test.example.com \
              | yq 'select(.kind == "NebariApp") | .spec.routing.routes | length')
            if [ "${routes:-0}" -lt 1 ]; then echo "$c: NebariApp has no spec.routing.routes"; exit 1; fi
            echo "$c: $routes route(s)"
          done

      # NIC locks the "default" AppProject to deny-all; packs must use nebari-apps.
      - name: ArgoCD examples use the nebari-apps project
        run: |
          if grep -rn --include='*.md' -E '^\s*project:\s*default\b' README.md docs examples; then
            echo "ArgoCD Application examples must use 'project: nebari-apps'"; exit 1
          fi

      - name: Operator version references match OPERATOR_REF
        run: |
          # dev/Makefile's OPERATOR_REF is the one pinned operator version. Links to
          # operator docs and releases must use it, and prose that names an operator
          # version must name one the integration matrix tests.
          set -euo pipefail
          ref=$(sed -n 's/^OPERATOR_REF ?= //p' dev/Makefile)
          tested=$(yq '.jobs.*.strategy.matrix.operator-ref[]' .github/workflows/test-integration.yaml | sort -u)
          echo "OPERATOR_REF=$ref; CI matrix: $(echo $tested)"
          echo "$tested" | grep -qx "$ref" || { echo "OPERATOR_REF $ref is not in the integration matrix"; exit 1; }
          fail=0
          # Operator doc and release links must point at the pinned version.
          while IFS= read -r hit; do
            echo "::error::$hit links a different operator version than OPERATOR_REF ($ref)"; fail=1
          done < <(git grep -nE 'nebari-operator/(blob|tree|releases/download)/v[0-9]' -- '*.md' '*.yaml' '*.yml' | grep -v "nebari-operator/[a-z/]*/$ref/" || true)
          # Prose naming an operator version must name one CI actually tests.
          while IFS= read -r hit; do
            v=$(echo "$hit" | grep -oE 'operator `?v[0-9]+\.[0-9]+\.[0-9]+[-a-z0-9.]*' | head -1 | grep -oE 'v[0-9].*' | sed 's/[.]$//')
            echo "$tested" | grep -qx "$v" || { echo "::error::$hit names operator $v, which the integration matrix does not test"; fail=1; }
          done < <(git grep -nE 'operator `?v[0-9]+\.[0-9]+\.[0-9]+' -- '*.md' || true)
          exit $fail

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test auth-fastapi token verification
        working-directory: examples/auth-fastapi
        run: |
          pip install -r app/requirements.txt -r tests/requirements.txt
          pytest tests
